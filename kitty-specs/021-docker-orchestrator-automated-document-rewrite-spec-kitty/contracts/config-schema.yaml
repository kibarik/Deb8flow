# Configuration Contract: Orchestrator Schema

**Feature**: 021-docker-orchestrator-automated-document-rewrite-spec-kitty
**Contract Type**: Configuration Schema
**Version**: 1.0.0

## Schema Definition

This contract defines the YAML schema for the `orchestrator:` section in `config/debate_config.yaml`.

## YAML Schema

```yaml
orchestrator:
  # === Workflow Control ===
  # Maximum number of retry attempts per phase when validation fails
  max_retries: <int, default: 3, min: 0, max: 10>

  # Timeout in seconds for artifact validation
  validation_timeout: <int, default: 30, min: 5, max: 300>

  # Skip final acceptance prompt (fully automated mode)
  auto_accept: <boolean, default: false>

  # === Output Settings ===
  # Suffix to append to corrected output files
  output_suffix: <string, default: ".corrected.", pattern: "^[a-z.]+$">

  # Add timestamp to output filename (e.g., file.corrected.20250221-153000.md)
  timestamp_output: <boolean, default: false>

  # Behavior when output file already exists
  overwrite_output: <enum: error|overwrite|timestamp, default: "error">

  # === Container Management ===
  # Docker image to use for Claude Code + Spec-Kitty environment
  docker_image: <string, default: "claude-code:latest">

  # Keep containers running after completion (for debugging)
  keep_containers: <boolean, default: false>

  # Maximum time in seconds before container is force-stopped
  container_timeout: <int, default: 3600, min: 60, max: 86400>

  # Container memory limit (e.g., "2g", "512m")
  container_memory_limit: <string, default: "2g", optional: true>

  # Container CPU quota (e.g., 1.0 = 1 CPU, 0.5 = 50% of 1 CPU)
  container_cpu_quota: <float, default: 1.0, min: 0.1, max: 8.0, optional: true>

  # === Logging ===
  # Directory for orchestrator log files
  log_dir: <string, default: ".orchestrator/logs">

  # Logging level (controls verbosity)
  log_level: <enum: DEBUG|INFO|WARNING|ERROR|CRITICAL, default: "INFO">

  # Enable verbose console output
  verbose: <boolean, default: false>

  # === Phase Configuration ===
  phases:
    - name: <enum: specify|research|plan|tasks|implement|review|accept>
      enabled: <boolean, default: true>
      validate: <boolean, default: false>
      # Phase-specific timeout (overrides global container_timeout)
      timeout: <int, optional: true>
```

## Default Configuration

```yaml
orchestrator:
  # Workflow control
  max_retries: 3
  validation_timeout: 30
  auto_accept: false

  # Output settings
  output_suffix: ".corrected."
  timestamp_output: false
  overwrite_output: "error"

  # Container management
  docker_image: "claude-code:latest"
  keep_containers: false
  container_timeout: 3600
  container_memory_limit: "2g"
  container_cpu_quota: 1.0

  # Logging
  log_dir: ".orchestrator/logs"
  log_level: "INFO"
  verbose: false

  # Phase configuration
  phases:
    - name: "specify"
      enabled: true
      validate: true
    - name: "research"
      enabled: true
      validate: false
    - name: "plan"
      enabled: true
      validate: true
    - name: "tasks"
      enabled: true
      validate: true
    - name: "implement"
      enabled: true
      validate: true
    - name: "review"
      enabled: true
      validate: false
    - name: "accept"
      enabled: true
      validate: false
```

## Validation Rules

### Type Validation
- All integers must be within specified min/max ranges
- All enums must match exact string values
- Booleans must be `true` or `false`
- Strings matching patterns must comply with regex

### Cross-Field Validation
- `max_retries` >= 0
- `validation_timeout` >= 5 seconds
- `container_timeout` >= 60 seconds
- `container_cpu_quota` > 0
- Phase names must be unique

### Configuration Loading Contract

**Function**: `load_orchestrator_config(config_path: Path) -> OrchestratorConfig`

**Behavior**:
1. Read YAML file from `config_path`
2. Extract `orchestrator:` section if present
3. If section missing, use all defaults
4. Validate all values against schema
5. Raise `ConfigValidationError` if validation fails with details

**Error Handling**:
- File not found: Use defaults, log warning
- Invalid YAML: Raise `ConfigValidationError`
- Invalid value: Raise `ConfigValidationError` with field path and reason
- Unknown field: Log warning, ignore field (forward compatibility)

## Example: Minimal Configuration

```yaml
# config/debate_config.yaml (minimal)
orchestrator:
  docker_image: "custom-claude:latest"
```

All other values use defaults.

## Example: Custom Validation

```yaml
orchestrator:
  max_retries: 5
  validation_timeout: 60
  phases:
    - name: "specify"
      validate: true
      timeout: 600  # 10 minutes
```

## Migration Path

**Version 1.0 → 1.1** (forward compatibility):
- New fields added with defaults
- Existing configurations remain valid
- Unknown fields ignored with warning
