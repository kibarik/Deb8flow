# File Storage Port
# Interface for persisting artifacts to the file system

port: FileStorage
version: 1.0.0
layer: application

description: |
  Handles all file system operations for debate artifacts:
  - Creating run directories
  - Saving JSON dialogue files
  - Saving markdown reports
  - Saving metadata
  Uses non-blocking I/O via asyncio.to_thread

interface:
  name: FileStorage
  type: Protocol

methods:
  - name: create_run_directory
    description: Create output directory for a run
    async: true

    input:
      type: CreateDirectoryRequest
      fields:
        - name: base_dir
          type: Path
          description: Base output directory

        - name: run_id
          type: RunId
          description: Run identifier

    output:
      type: Path
      description: Full path to created directory

    errors:
      - type: DirectoryCreationError
        description: Failed to create directory

  - name: save_dialogue_json
    description: Save debate room dialogue as JSON
    async: true

    input:
      type: SaveDialogueRequest
      fields:
        - name: output_dir
          type: Path
          description: Output directory

        - name: room
          type: DebateRoom
          description: Debate room with dialogue

    output:
      type: None

    errors:
      - type: FileWriteError
        description: Failed to write dialogue file

  - name: save_report
    description: Save markdown report
    async: true

    input:
      type: SaveReportRequest
      fields:
        - name: output_dir
          type: Path
          description: Output directory

        - name: report_name
          type: str
          description: Report filename (e.g., "final_report.md")

        - name: content
          type: str
          description: Markdown content

    output:
      type: None

    errors:
      - type: FileWriteError
        description: Failed to write report file

  - name: save_metadata
    description: Save run metadata as JSON
    async: true

    input:
      type: SaveMetadataRequest
      fields:
        - name: output_dir
          type: Path
          description: Output directory

        - name: metadata
          type: CommitteeMetadata
          description: Run metadata

    output:
      type: None

    errors:
      - type: FileWriteError
        description: Failed to write metadata file

  - name: save_intermediate_report
    description: |
      Save intermediate report with retry logic.
      Automatically retries on I/O errors.
    async: true

    input:
      type: SaveIntermediateReportRequest
      fields:
        - name: output_dir
          type: Path
          description: Output directory

        - name: content
          type: str
          description: Report content

        - name: max_retries
          type: int
          description: Maximum retry attempts (default: 2)

    output:
      type: bool
      description: True if save succeeded

    errors:
      - type: FileWriteError
        description: Failed after all retries

implementation:
  adapter: LocalFileStorage
  location: src/shared/debate/infrastructure/storage/local_storage.py
  description: |
    Implements file storage using asyncio.to_thread for non-blocking I/O.
    Creates directory structure:
    {base_dir}/{run_id}/
      ├── metadata.json
      ├── TPM_vs_CPO.json
      ├── TPM_vs_CPO_dialogue.json
      ├── TPM_vs_CFO.json
      ├── TPM_vs_CFO_dialogue.json
      ├── TPM_vs_CTO.json
      ├── TPM_vs_CTO_dialogue.json
      ├── TPM_vs_BDM.json
      ├── TPM_vs_BDM_dialogue.json
      ├── final_report.md
      └── conclusion.md

error_handling:
  retry_strategy: exponential_backoff
  base_delay: 1.0  # seconds
  max_delay: 10.0  # seconds
  retriable_errors:
    - OSError
    - IOError
  non_retriable_errors:
    - PermissionError
    - FileNotFoundError
