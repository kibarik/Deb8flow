[project]
name = "deb8flow"
version = "0.1.0"
description = "Multi-agent debate system for analyzing .docx documents"
authors = ["Alex Ishmanov"]
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "python-docx>=1.1.0",
    "langgraph>=0.3.0",
    "langchain>=0.3.0",
    "openai>=1.0.0",
    "rich>=14.0.0",
    "typing_extensions>=4.0.0",
]

[project.optional-dependencies]
extras = ["dev"]

[project.scripts]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
