# OpenAI Configuration Example
# For use with official OpenAI API

llm:
  base_url: ""  # Empty for OpenAI default
  model: "gpt-4o-mini"
  api_key: ""  # Set OPENAI_API_KEY environment variable instead
  temperature: 0.8
  max_tokens: 1500

debate:
  max_retries: 2
  max_concurrency: 2

output:
  directory: "./committee_output"

logging:
  level: "INFO"
  verbose: false
  quiet: false
