# Пример конфигурации для русскоязычных дебатов
# Configuration example for Russian-language debates

llm:
  base_url: "${DEBATE_BASE_URL:}"
  model: "${DEBATE_MODEL:gpt-4o-mini}"
  api_key: "${OPENAI_API_KEY:}"
  temperature: 0.8
  max_tokens: 2000

debate:
  max_retries: 2
  max_concurrency: 2
  language: "ru"  # Русский язык для вывода

# Конфигурация агентов
agents:
  # Основной агент (PRO) - защищает проект
  main:
    name: "TPM"
    prompt: "config/prompts/roles/tpm.txt"

  # Оппоненты (CON) - критикуют проект
  opponents:
    - name: "CPO"
      prompt: "config/prompts/roles/cpo.txt"
    - name: "CFO"
      prompt: "config/prompts/roles/cfo.txt"
    - name: "CTO"
      prompt: "config/prompts/roles/cto.txt"
    - name: "BDM"
      prompt: "config/prompts/roles/bdm.txt"

output:
  directory: "./committee_output"
  save_dialogues: true
  save_metadata: true

logging:
  level: "INFO"
  verbose: false
  quiet: false
